name: Validate and publish to Comfy Registry

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Reach the protected publish boundary for this exact candidate
        required: true
        type: boolean
        default: false
      candidate_sha:
        description: Exact 40-character candidate commit SHA
        required: false
        type: string
      base_sha:
        description: Exact pre-version-bump commit SHA
        required: false
        type: string
      version:
        description: Exact new X.Y.Z version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: registry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Secretless exact-candidate validation
    runs-on: ubuntu-24.04
    outputs:
      release-intent: ${{ steps.release-intent.outputs.release-intent }}
    steps:
      - name: Check out exact event candidate
        # actions/checkout v4.2.2, MIT
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up exact Python runtime
        # actions/setup-python v5.6.0, MIT
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"

      - name: Set up exact Node runtime
        # actions/setup-node v4.4.0, MIT
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.20.2"

      - name: Install hash-locked validation dependencies
        run: >-
          python -m pip install
          --require-hashes --only-binary=:all:
          -r .github/requirements-ci.txt

      - name: Validate exact clean checkout before execution
        run: python scripts/validate_publish_candidate.py validate --expected-sha "$GITHUB_SHA"

      - name: Run hosted Linux diagnostics
        env:
          PYTHON: python
        run: bash scripts/run_full_tests_linux.sh

      - name: Validate no-diff exact checkout after execution
        run: python scripts/validate_publish_candidate.py validate --expected-sha "$GITHUB_SHA"

      - name: Detect trusted push release intent
        id: release-intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          release_intent=false
          if [[ "$EVENT_NAME" == "push" && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- pyproject.toml; then
              release_intent=true
            fi
          fi
          echo "release-intent=$release_intent" >> "$GITHUB_OUTPUT"

  publication-readiness:
    name: Secretless publication readiness
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
    if: >-
      ${{
        github.repository_owner == 'rookiestar28' &&
        github.ref == 'refs/heads/main' &&
        ((github.event_name == 'push' && needs.validate.outputs.release-intent == 'true') ||
         (github.event_name == 'workflow_dispatch' && inputs.publish == true))
      }}
    steps:
      - name: Check out exact release candidate
        # actions/checkout v4.2.2, MIT
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up exact Python runtime
        # actions/setup-python v5.6.0, MIT
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"

      - name: Install hash-locked publication dependencies
        run: >-
          python -m pip install
          --require-hashes --only-binary=:all:
          -r .github/requirements-publish.txt

      - name: Validate release intent and normalize archive timestamps
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          MANUAL_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          expected_version="$VERSION_INPUT"
          manual_flag=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            manual_flag+=(--manual-publish)
          else
            expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          python scripts/validate_publish_candidate.py release \
            --expected-sha "$CANDIDATE_SHA" \
            --event-sha "$EVENT_SHA" \
            --event-name "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --repository-owner "$REPOSITORY_OWNER" \
            --base-sha "$BASE_SHA" \
            --expected-version "$expected_version" \
            --check-registry --normalize-mtimes \
            --manual-candidate-sha "$MANUAL_CANDIDATE_SHA" "${manual_flag[@]}"

      - name: Prove deterministic public-safe archive
        id: archive
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          comfy --skip-prompt --no-enable-telemetry node pack
          first_hash="$(python scripts/validate_publish_candidate.py archive --archive node.zip --expected-sha "$CANDIDATE_SHA" | python -c 'import json,sys; print(json.load(sys.stdin)["archive_sha256"])')"
          echo "archive-sha256=$first_hash" >> "$GITHUB_OUTPUT"
          rm -f node.zip
          comfy --skip-prompt --no-enable-telemetry node pack
          python scripts/validate_publish_candidate.py archive --archive node.zip --expected-sha "$CANDIDATE_SHA" --expected-archive-sha "$first_hash"
          rm -f node.zip
          python scripts/validate_publish_candidate.py validate --expected-sha "$CANDIDATE_SHA"

  publish-node:
    name: Publish previously validated exact candidate
    needs: [validate, publication-readiness]
    runs-on: ubuntu-24.04
    if: >-
      ${{
        needs.validate.result == 'success' &&
        needs.publication-readiness.result == 'success' &&
        github.repository_owner == 'rookiestar28' &&
        github.ref == 'refs/heads/main' &&
        ((github.event_name == 'push' && needs.validate.outputs.release-intent == 'true') ||
         (github.event_name == 'workflow_dispatch' && inputs.publish == true))
      }}
    steps:
      - name: Check out exact release candidate
        # actions/checkout v4.2.2, MIT
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up exact Python runtime
        # actions/setup-python v5.6.0, MIT
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.15"

      - name: Install hash-locked publication dependencies
        run: >-
          python -m pip install
          --require-hashes --only-binary=:all:
          -r .github/requirements-publish.txt

      - name: Revalidate release and archive without credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          MANUAL_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.base_sha || github.event.before }}
          VERSION_INPUT: ${{ inputs.version }}
          READINESS_ARCHIVE_SHA: ${{ needs.publication-readiness.outputs.archive-sha256 }}
        run: |
          expected_version="$VERSION_INPUT"
          manual_flag=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            manual_flag+=(--manual-publish)
          else
            expected_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          python scripts/validate_publish_candidate.py release \
            --expected-sha "$CANDIDATE_SHA" \
            --event-sha "$EVENT_SHA" \
            --event-name "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --repository-owner "$REPOSITORY_OWNER" \
            --base-sha "$BASE_SHA" \
            --expected-version "$expected_version" \
            --check-registry --normalize-mtimes \
            --manual-candidate-sha "$MANUAL_CANDIDATE_SHA" "${manual_flag[@]}"
          comfy --skip-prompt --no-enable-telemetry node pack
          first_hash="$(python scripts/validate_publish_candidate.py archive --archive node.zip --expected-sha "$CANDIDATE_SHA" --expected-archive-sha "$READINESS_ARCHIVE_SHA" | python -c 'import json,sys; print(json.load(sys.stdin)["archive_sha256"])')"
          rm -f node.zip
          comfy --skip-prompt --no-enable-telemetry node pack
          python scripts/validate_publish_candidate.py archive --archive node.zip --expected-sha "$CANDIDATE_SHA" --expected-archive-sha "$first_hash"
          rm -f node.zip
          python scripts/validate_publish_candidate.py validate --expected-sha "$CANDIDATE_SHA"

      - name: Publish exact candidate
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          test -n "$REGISTRY_ACCESS_TOKEN"
          comfy --skip-prompt --no-enable-telemetry node publish --token "$REGISTRY_ACCESS_TOKEN"
